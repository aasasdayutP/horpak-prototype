<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HORPAK · Interactive prototype</title>
<style>
    :root {
        --brand: #1677ff;
        --soft: #eaf3ff;
        --bg: #f2f7fc;
        --ink: #243247;
        --muted: #708098;
        --line: #e4ecf5
    }

    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.65 Tahoma, Arial, sans-serif
    }

    button,
    input,
    select {
        font: inherit
    }

    button {
        cursor: pointer;
        border: 0;
        background: transparent;
        color: inherit
    }

    button:hover {
        filter: brightness(.94)
    }

    button:disabled {
        opacity: .4;
        cursor: not-allowed
    }

    button:focus-visible {
        outline: 3px solid #91bdff;
        outline-offset: 3px
    }

    .lab {
        height: 48px;
        background: #172942;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 24px;
        font-size: 12px
    }

    .lab button {
        color: white;
        padding: 5px 12px;
        border-radius: 6px
    }

    .lab .chosen {
        background: #35506e
    }

    .layout {
        display: grid;
        grid-template-columns: 218px 1fr;
        min-height: calc(100vh - 48px)
    }

    aside {
        background: white;
        border-right: 1px solid var(--line);
        padding: 30px 18px;
        display: flex;
        flex-direction: column;
        gap: 24px
    }

    .logo {
        font-size: 25px;
        font-weight: bold;
        letter-spacing: 2px;
        color: var(--brand)
    }

    .small {
        font-size: 12px;
        color: var(--muted)
    }

    nav {
        display: grid;
        gap: 7px
    }

    nav button {
        text-align: left;
        padding: 12px 16px;
        border-radius: 10px;
        color: var(--muted)
    }

    nav button.active {
        color: var(--brand);
        background: var(--soft);
        font-weight: bold
    }

    .sidefoot {
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding-top: 20px
    }

    .topbar {
        height: 76px;
        background: #ffffffb8;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 34px
    }

    .avatar {
        background: var(--soft);
        color: var(--brand);
        padding: 10px;
        border-radius: 50%;
        margin-left: 12px
    }

    .content {
        padding: 30px 34px;
        max-width: 1540px;
        margin: auto
    }

    h1 {
        font-size: 27px;
        margin: 0 0 4px;
        letter-spacing: -.7px
    }

    h2 {
        font-size: 17px;
        margin: 0 0 18px
    }

    h3 {
        font-size: 15px;
        margin: 0 0 8px
    }

    p {
        margin: 4px 0 14px
    }

    .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        gap: 16px
    }

    .muted {
        color: var(--muted)
    }

    .btn {
        background: var(--brand);
        color: white;
        padding: 11px 20px;
        border-radius: 9px;
        font-weight: bold;
        display: inline-block
    }

    .secondary {
        background: var(--soft);
        color: var(--brand)
    }

    .white {
        background: white;
        color: var(--brand)
    }

    .grid {
        display: grid;
        gap: 20px
    }

    .stats {
        grid-template-columns: repeat(4, 1fr);
        margin-bottom: 24px
    }

    .card {
        background: white;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 24px;
        box-shadow: 0 5px 20px #163d6410
    }

    .stat strong {
        display: block;
        font-size: 29px;
        letter-spacing: -1px;
        margin: 9px 0
    }

    .stat .icon {
        float: right;
        background: var(--soft);
        color: var(--brand);
        padding: 5px 12px;
        border-radius: 9px
    }

    .two {
        grid-template-columns: 1.65fr 1fr;
        margin-bottom: 24px
    }

    .badge {
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 12px;
        white-space: nowrap;
        background: var(--soft);
        color: var(--brand)
    }

    .paid {
        background: #e6f7ef;
        color: #168050
    }

    .pending {
        background: #fff3d9;
        color: #a56907
    }

    .unpaid {
        background: #ffebed;
        color: #bc4252
    }

    .between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px
    }

    .row {
        padding: 14px 0;
        border-bottom: 1px solid var(--line)
    }

    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left
    }

    th {
        font-size: 12px;
        color: var(--muted);
        font-weight: normal;
        background: #f8fafd
    }

    td,
    th {
        padding: 15px 12px;
        border-bottom: 1px solid var(--line)
    }

    .link {
        color: var(--brand);
        font-weight: bold
    }

    .tablewrap {
        overflow: auto
    }

    .bars {
        display: flex;
        height: 170px;
        align-items: end;
        gap: 22px;
        padding: 15px 10px 0
    }

    .bar {
        flex: 1;
        border-radius: 6px 6px 0 0;
        background: #cfe5ff;
        position: relative
    }

    .bar:last-child {
        background: var(--brand)
    }

    .bar span {
        position: absolute;
        bottom: -28px;
        text-align: center;
        width: 100%;
        font-size: 11px;
        color: var(--muted)
    }

    .chart {
        padding-bottom: 30px
    }

    .rooms {
        grid-template-columns: repeat(4, 1fr)
    }

    .room {
        text-align: left;
        min-height: 130px
    }

    .room strong {
        font-size: 25px;
        display: block;
        margin-bottom: 8px
    }

    .filter {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap
    }

    .filter button {
        padding: 8px 17px;
        border-radius: 8px;
        background: white;
        border: 1px solid var(--line)
    }

    .filter button.active {
        background: var(--brand);
        color: white
    }

    input,
    select {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: white;
        color: var(--ink);
        max-width: 100%
    }

    label {
        display: block;
        margin: 15px 0 6px;
        color: var(--muted);
        font-size: 12px
    }

    .field {
        width: 100%
    }

    .total {
        border-top: 1px solid var(--line);
        padding-top: 18px;
        margin-top: 18px;
        font-size: 19px;
        font-weight: bold
    }

    .bill {
        max-width: 800px
    }

    .bill .row:last-child {
        border: 0
    }

    .notice {
        padding: 14px 18px;
        background: var(--soft);
        border-radius: 10px;
        color: var(--brand);
        margin-bottom: 20px
    }

    .phone {
        width: 414px;
        max-width: 100%;
        margin: 30px auto;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 15px 70px #17294220;
        min-height: 800px
    }

    .phone .topbar {
        padding: 18px 22px;
        height: 80px
    }

    .phone .content {
        padding: 22px 20px
    }

    .phone h1 {
        font-size: 24px
    }

    .phone .card {
        padding: 20px
    }

    .phone .hero {
        background: var(--brand);
        color: white;
        border: 0
    }

    .hero .small {
        color: #dceaff
    }

    .hero strong {
        font-size: 39px;
        display: block;
        margin: 12px 0
    }

    .mobileNav {
        display: flex;
        background: white;
        padding: 13px 8px;
        border-top: 1px solid var(--line);
        justify-content: space-around
    }

    .mobileNav button {
        padding: 7px;
        color: var(--muted);
        font-size: 12px
    }

    .mobileNav button.active {
        color: var(--brand);
        font-weight: bold
    }

    .phone .grid {
        gap: 12px
    }

    .phone .two {
        grid-template-columns: 1fr 1fr
    }

    .phone .head {
        margin-bottom: 17px
    }

    .phone .row {
        font-size: 13px
    }

    .phone .btn {
        width: 100%;
        text-align: center;
        margin-top: 14px
    }

    .swatch {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 0 0 1px #cad4e2
    }

    .themes {
        display: flex;
        align-items: center;
        gap: 8px
    }

    .empty {
        text-align: center;
        padding: 70px 20px
    }

    .login {
        max-width: 410px;
        margin: 8vh auto
    }

    .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #172942;
        color: white;
        padding: 12px 24px;
        border-radius: 12px;
        z-index: 10
    }

    .hide {
        display: none
    }

    .progress {
        height: 10px;
        border-radius: 6px;
        background: var(--soft);
        overflow: hidden
    }

    .progress div {
        height: 100%;
        background: var(--brand)
    }

    .paper {
        background: #f8fafd;
        border: 1px dashed #bbcce1;
        padding: 24px;
        text-align: center;
        border-radius: 10px
    }

    .check {
        font-size: 45px;
        color: #168050
    }

    .caption {
        font-size: 11px;
        color: var(--muted);
        margin-top: 24px
    }

    svg {
        width: 100%;
        height: 180px;
        overflow: visible
    }

    @media(max-width:900px) {
        .layout {
            grid-template-columns: 175px 1fr
        }

        .content {
            padding: 22px
        }

        .stats {
            grid-template-columns: repeat(2, 1fr)
        }

        .two {
            grid-template-columns: 1fr
        }

        .rooms {
            grid-template-columns: repeat(2, 1fr)
        }

        .lab {
            padding: 0 10px
        }

        .lab>span {
            display: none
        }
    }

    @media(max-width:600px) {
        .layout {
            display: block
        }

        aside {
            padding: 15px;
            gap: 10px
        }

        aside nav {
            display: flex;
            overflow: auto
        }

        nav button {
            white-space: nowrap
        }

        .sidefoot {
            display: none
        }

        .topbar {
            padding: 0 20px
        }

        .head {
            align-items: start
        }

        .phone {
            margin: 0 auto;
            border-radius: 0;
            box-shadow: none
        }

        .stats {
            gap: 10px
        }

        .card {
            padding: 18px
        }

        .stat strong {
            font-size: 24px
        }

        .content {
            padding: 20px 14px
        }
    }

    @media print {

        .lab,
        aside,
        .topbar,
        .head,
        .mobileNav,
        .btn,
        .caption {
            display: none !important
        }

        .layout {
            display: block
        }

        .phone {
            width: 100%;
            box-shadow: none;
            border: 0
        }

        .card {
            box-shadow: none
        }
    }

    .settings-form {
        width: 100%
    }

    .settings-rates {
        grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    @media(max-width:600px) {
        .settings-rates {
            grid-template-columns: 1fr
        }
    }
</style>
<div class="lab"><span>HORPAK / DESIGN PROTOTYPE · ข้อมูลจำลอง</span>
    <div><button id="adminTab" onclick="portal('admin')">Admin desktop</button><button id="tenantTab"
            onclick="portal('tenant')">Tenant mobile</button><button onclick="portal('login')">Login</button></div>
    <div class="themes"><button class="swatch" aria-label="ธีมฟ้า" style="background:#1677ff"
            onclick="theme('blue')"></button><button class="swatch" aria-label="ธีมเขียว" style="background:#138b83"
            onclick="theme('teal')"></button><button class="swatch" aria-label="ธีมม่วง" style="background:#7657d6"
            onclick="theme('violet')"></button></div>
</div>
<div id="app"></div>
<div id="toast" class="toast hide" role="status"></div>
<script>
  let mode = 'admin';
  let page = 'dashboard';
  let filter = 'ทั้งหมด';
  let billStatus = 'unpaid';
  let selectedRoom = '201';
  let noRoom = false;
  let slip = false;

  const money = n => '฿' + n.toLocaleString('th-TH');

  const names = {
    dashboard: 'ภาพรวม',
    rooms: 'ห้องพัก',
    tenants: 'ผู้เช่า',
    meters: 'จดมิเตอร์',
    invoices: 'บิลและใบแจ้งหนี้',
    reports: 'รายงาน',
    settings: 'ตั้งค่าหอพัก'
  };

  const badge = s => `
    <span class="badge ${s}">
      ${
        {
          paid: 'จ่ายแล้ว',
          pending: 'รอตรวจสอบ',
          unpaid: 'ยังไม่จ่าย'
        }[s] || s
      }
    </span>
  `;

  const btn = (t, a, cls = '') => `
    <button class="btn ${cls}" onclick="${a}">
      ${t}
    </button>
  `;

  const go = p => {
    page = p;
    filter = 'ทั้งหมด';

    render();
    window.scrollTo(0, 0);
  };

  function portal(m) {
    mode = m;
    page = m === 'tenant' ? 'home' : 'dashboard';

    render();
  }

  function notify(t) {
    document.getElementById('toast').textContent = t;
    document.getElementById('toast').classList.remove('hide');

    setTimeout(() => {
      document.getElementById('toast').classList.add('hide');
    }, 2600);
  }

  function theme(t) {
    let c = {
      blue: ['#1677ff', '#eaf3ff', '#f2f7fc'],
      teal: ['#138b83', '#e5f5f1', '#f0f7f5'],
      violet: ['#7657d6', '#f0ecfc', '#f6f4fb']
    }[t];

    ['--brand', '--soft', '--bg'].forEach((k, i) => {
      document.documentElement.style.setProperty(k, c[i]);
    });
  }

  function heading(title, sub, action = '') {
    return `
      <div class="head">
        <div>
          <h1>${title}</h1>
          <div class="muted">${sub}</div>
        </div>

        ${action}
      </div>
    `;
  }

  function chart() {
    return `
      <svg
        viewBox="0 0 600 180"
        aria-label="กราฟรายรับตัวอย่าง 6 เดือน"
      >
        <path
          d="M0 150H600 M0 90H600 M0 30H600"
          stroke="#e4ecf5"
          fill="none"
        />

        <path
          d="M0 142 C40 140 60 62 110 84 S170 125 220 96 S280 120 330 62 S390 90 450 50 S520 68 600 20 L600 180H0Z"
          fill="var(--soft)"
        />

        <path
          d="M0 142 C40 140 60 62 110 84 S170 125 220 96 S280 120 330 62 S390 90 450 50 S520 68 600 20"
          fill="none"
          stroke="var(--brand)"
          stroke-width="3"
        />
      </svg>

      <div class="between small">
        <span>เม.ย.</span>
        <span>พ.ค.</span>
        <span>มิ.ย.</span>
        <span>ก.ค.</span>
        <span>ส.ค.</span>
        <span>ก.ย.</span>
      </div>
    `;
  }

  function lines() {
    return `
      <div class="row between">
        <span>ค่าเช่าห้อง</span>
        <b>฿3,500</b>
      </div>

      <div class="row between">
        <span>ค่าไฟ · 120 หน่วย × ฿8</span>
        <b>฿960</b>
      </div>

      <div class="row between">
        <span>ค่าน้ำ · 5 หน่วย × ฿20</span>
        <b>฿100</b>
      </div>

      <div class="row between">
        <span>อินเทอร์เน็ต</span>
        <b>฿200</b>
      </div>

      <div class="total between">
        <span>ยอดรวม</span>
        <span>฿4,760</span>
      </div>
    `;
  }

  function invoiceTable() {
    return `
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>เลขที่บิล / รอบเดือน</th>
              <th>ห้อง / ผู้เช่า</th>
              <th>ยอดชำระ</th>
              <th>สถานะ</th>
              <th></th>
            </tr>
          </thead>

          <tbody>
            ${[
              ['INV-2609-201', '201', 'กิตติ พรดี', 4760, billStatus],
              ['INV-2609-202', '202', 'มาลี ใจดี', 4320, 'pending'],
              ['INV-2609-203', '203', 'ธนา สุขใจ', 4580, 'paid'],
              ['INV-2609-204', '204', 'พิมพ์ชนก ดีใจ', 4620, 'unpaid']
            ]
              .filter(r => filter === 'ทั้งหมด' || r[4] === filter)
              .map(r => `
                <tr>
                  <td>
                    ${r[0]}
                    <div class="small">กันยายน 2569</div>
                  </td>

                  <td>${r[1]} · ${r[2]}</td>
                  <td>${money(r[3])}</td>
                  <td>${badge(r[4])}</td>

                  <td>
                    <button
                      class="link"
                      onclick="selectedRoom='${r[1]}';go('${r[1] === '201' ? 'bill' : 'sampleBill'}')"
                    >
                      ดูบิล ↗
                    </button>
                  </td>
                </tr>
              `)
              .join('')}
          </tbody>
        </table>
      </div>
    `;
  }

  function filters(items) {
    return `
      <div class="filter">
        ${items
          .map(([v, t]) => `
            <button
              class="${filter === v ? 'active' : ''}"
              onclick="filter='${v}';render()"
            >
              ${t}
            </button>
          `)
          .join('')}
      </div>
    `;
  }

  function admin() {
    let body = '';

    if (page === 'dashboard') {
      body =
        heading(
          'ภาพรวมของหอพัก',
          'ยินดีต้อนรับกลับมา · กันยายน 2569',
          btn('+ ออกบิลประจำเดือน', "go('meters')")
        ) +
        `
          <div class="grid stats">
            ${[
              [
                'รายรับเดือนนี้',
                '฿128,450',
                'รับแล้ว 28 จาก 32 ห้อง',
                '฿'
              ],
              [
                'ห้องมีผู้เช่า',
                `${activeRooms().filter(r => r.occupied).length} / ${activeRooms().length}`,
                `อัตราเข้าพัก ${occupancy()}%`,
                '⌂'
              ],
              [
                'ยอดค้างชำระ',
                '฿18,920',
                '4 ห้องที่ยังไม่ชำระ',
                '↗'
              ],
              [
                'กำลังตรวจสอบ',
                '3 รายการ',
                'ระบบตรวจการชำระอัตโนมัติ',
                '✓'
              ]
            ]
              .map((r, i) => `
                <button
                  class="card stat"
                  style="text-align:left"
                  onclick="go('${['reports', 'rooms', 'invoices', 'invoices'][i]}')"
                >
                  <span class="icon">${r[3]}</span>
                  <span class="muted">${r[0]}</span>
                  <strong>${r[1]}</strong>
                  <span class="small">${r[2]}</span>
                </button>
              `)
              .join('')}
          </div>

          <div class="grid two">
            <section class="card">
              <div class="between">
                <h2>รายรับย้อนหลัง</h2>
                <span class="small">6 เดือนล่าสุด · บาท</span>
              </div>

              ${chart()}
            </section>

            <section class="card">
              <h2>สถานะห้องพัก</h2>

              <strong style="font-size:38px">
                ${occupancy()}<span class="muted" style="font-size:20px">%</span>
              </strong>

              <div class="progress">
                <div style="width:${occupancy()}%"></div>
              </div>

              <div class="row between">
                <span>มีผู้เช่า</span>
                <b>${activeRooms().filter(r => r.occupied).length} ห้อง</b>
              </div>

              <div class="row between">
                <span>ห้องว่าง</span>
                <b>${activeRooms().filter(r => !r.occupied).length} ห้อง</b>
              </div>

              <div class="between">
                <span>ห้องทั้งหมด</span>
                <b>${activeRooms().length} ห้อง</b>
              </div>
            </section>
          </div>

          <section class="card">
            <div class="between">
              <h2>บิลล่าสุด</h2>

              <button class="link" onclick="go('invoices')">
                ดูทั้งหมด →
              </button>
            </div>

            ${invoiceTable()}
          </section>
        `;
    }

    if (page === 'rooms') {
      body =
        heading(
          'ห้องพัก',
          `ทั้งหมด ${activeRooms().length} ห้อง`,
          btn('จัดการห้องพัก', "go('settings')", 'secondary')
        ) +
        filters([
          ['ทั้งหมด', 'ทุกห้อง'],
          ['occupied', 'มีผู้เช่า'],
          ['vacant', 'ห้องว่าง']
        ]) +
        `
          <div class="grid rooms">
            ${
              activeRooms()
                .filter(r =>
                  filter === 'ทั้งหมด' ||
                  (filter === 'occupied') === r.occupied
                )

  function meterValues() {
    const r = meterRecords[selectedRoom];
    const es = document.getElementById('electric').value;
    const ws = document.getElementById('water').value;
    const e = Number(es);
    const w = Number(ws);

    return {
      r,
      e,
      w,
      valid:
        es.trim() !== '' &&
        ws.trim() !== '' &&
        Number.isInteger(e) &&
        Number.isInteger(w) &&
        e >= r.prevE &&
        w >= r.prevW
    };
  }

  function calc() {
    const { r, e, w, valid } = meterValues();

    document.getElementById('calc').textContent = valid
      ? `ไฟ ${e - r.prevE} หน่วย = ${money((e - r.prevE) * 8)} · น้ำ ${w - r.prevW} หน่วย = ${money((w - r.prevW) * 20)}`

            ประเภทห้อง · เลือกหรือพิมพ์ประเภทใหม่
          </label>

          <input
            id="roomType"
            class="field"
            list="roomTypeOptions"
            maxlength="50"
            value="${esc(r.type)}"
            required
          >

          <datalist id="roomTypeOptions">
            ${[
              ...new Set([
                'Standard',
                'Deluxe',
                ...activeRooms().map(x => x.type)
              ])
            ]
              .map(t => `<option value="${esc(t)}">`)
              .join('')}
          </datalist>

          <label for="roomCooling">แอร์ / พัดลม</label>

          <select id="roomCooling" class="field">
            ${['แอร์', 'พัดลม', 'แอร์และพัดลม']
              .map(t => `
                <option ${r.cooling === t ? 'selected' : ''}>
                  ${t}
                </option>
              `)
              .join('')}
          </select>

          <div class="grid two" style="margin-top:16px">
            <div>
              <label for="roomRent">ค่าเช่า / เดือน (บาท)</label>

              <input
                id="roomRent"
                class="field"
                type="number"
                min="0"
                step="0.01"
                value="${r.rent}"
                required
              >
            </div>

            <div>
              <label for="roomArea">ขนาดห้อง (ตร.ม.)</label>

              <input
                id="roomArea"
                class="field"
                type="number"
                min="1"
                step="0.01"
                value="${r.area}"
                required
              >
            </div>
          </div>

          <button class="btn" type="submit">
            ${editingRoom ? 'บันทึกการแก้ไข' : 'เพิ่มห้องพัก'}
          </button>

          ${btn('ยกเลิก', "go('settings')", 'secondary')}

          <p class="caption">
            การแก้ข้อมูลห้องไม่เปลี่ยนบิลที่ออกไว้แล้ว
            · ห้องใหม่จะเริ่มเป็นห้องว่าง
          </p>
        </form>
      `
    );
  }

  function saveRoom() {
    const val = id =>
      document.getElementById(id).value.trim();

    const code = val('roomCode');
    const type = val('roomType');
    const cooling = val('roomCooling');
    const floor = Number(val('roomFloor'));
    const rent = Number(val('roomRent'));
    const area = Number(val('roomArea'));

    if (
      !code ||
      !type ||
      !val('roomRent') ||
      !Number.isInteger(floor) ||
      floor < 1 ||
      floor > 200 ||
      !Number.isFinite(rent) ||
      rent < 0 ||
      !Number.isFinite(area) ||
      area < 1 ||
      !['แอร์', 'พัดลม', 'แอร์และพัดลม'].includes(cooling)
    ) {
      notify('กรุณากรอกข้อมูลห้องให้ครบและถูกต้อง');
      return;
    }

    if (
      Object.values(roomData).some(r =>
        r.id !== editingRoom &&
        r.code.toLowerCase() === code.toLowerCase()
      )
    ) {
      notify(
        'เลขห้องนี้มีอยู่แล้ว รวมถึงห้องที่นำออก กรุณาแก้ไขหรือกู้คืนห้องเดิม'
      );
      return;
    }

    const id = editingRoom || String(nextRoomId++);

    roomData[id] = {
      ...roomData[id],
      id,
      code,
      type,
      cooling,
      floor,
      rent,
      area,
      occupied: roomData[id]?.occupied || false,
      deleted: false
    };

    if (!meterRecords[id]) {
      meterRecords[id] = {
        prevE: 0,
        prevW: 0,
        e: null,
        w: null,
        saved: false
      };
    }

    if (!editingRoom) {
      roomPage = Math.ceil(activeRooms().length / roomPageSize);
    }

    notify(editingRoom ? 'แก้ไขห้องแล้ว' : 'เพิ่มห้องแล้ว');
    go('settings');
  }

  function removeRoom(id) {
    const r = roomData[id];

    if (r.occupied) {
      notify('ห้องนี้มีผู้เช่า ต้องย้ายผู้เช่าออกก่อนนำห้องออก');
      return;
    }

    if (
      !window.confirm(
        'นำห้อง ' + r.code + ' ออกจากรายการ? สามารถกู้คืนได้'
      )
    ) {
      return;
    }

    r.deleted = true;

    notify('นำห้องออกแล้ว');
    render();
  }

  function restoreRoom(id) {
    roomData[id].deleted = false;

    roomPage =
      Math.floor(
        activeRooms().findIndex(r => r.id === id) / roomPageSize
      ) + 1;

    notify('กู้คืนห้องแล้ว');
    render();
  }

  function showTenantContact() {

  function assignTenant() {
    const u = registeredTenants.find(
      u => u.id === document.getElementById('tenantAccount').value
    );

    const r = roomData[
      document.getElementById('tenantRoom').value
    ];

    const date = document.getElementById('tenantMoveIn').value;

    if (
      !u ||
      u.roomId !== null ||
      !r ||
      r.deleted ||
      r.occupied ||
      !/^\d{4}-\d{2}-\d{2}$/.test(date)
    ) {
      notify('กรุณาเลือกบัญชีผู้เช่า ห้องว่าง และวันที่เข้าอยู่ให้ครบ');
      return;
    }

    u.roomId = r.id;
    u.moveIn = date;
    r.occupied = true;

    notify('ผูกบัญชีผู้เช่ากับห้อง ' + r.code + ' แล้ว');
    go('tenants');
  }
